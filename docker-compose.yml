services:
  pipeline:
    build: .
    image: ecommerce-pipeline:local
    environment:
      ECOMMERCE_RAW_CSV_PATH: /data/raw/ecommerce_customer_data_custom_ratios.csv
      ECOMMERCE_PROCESSED_ROOT: /data/processed
    volumes:
      # Place CSV under data/raw/ on the host (see README — Kaggle download)
      - ./data/raw/ecommerce_customer_data_custom_ratios.csv:/data/raw/ecommerce_customer_data_custom_ratios.csv:ro
      - ./data/processed:/data/processed
      # Persist DuckDB + dbt artifacts for inspection (`duckdb dbt/target/pipeline.duckdb`)
      - ./dbt/target:/app/dbt/target
