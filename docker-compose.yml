services:
  pipeline:
    build: .
    image: ecommerce-pipeline:local
    environment:
      ECOMMERCE_RAW_CSV_PATH: /data/raw/ecommerce_customer_data_custom_ratios.csv
      ECOMMERCE_PROCESSED_ROOT: /data/processed
    volumes:
      # Mount host CSV + persist processed outputs on the host
      - ./ecommerce_customer_data_custom_ratios.csv:/data/raw/ecommerce_customer_data_custom_ratios.csv:ro
      - ./data/processed:/data/processed
