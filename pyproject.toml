[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-pipeline"
version = "0.1.0"
description = "Dagster + PySpark + dbt e-commerce batch pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ecommerce_pipeline*"]

[tool.dagster]
module_name = "ecommerce_pipeline.definitions"
code_location_name = "ecommerce_pipeline"
